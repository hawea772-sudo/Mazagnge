<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لُبّ - Labb | أسهل طريقة لطلب التسالي</title>
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            direction: rtl;
        }

        input, button { font-size: 16px !important; }

        /* --- شاشة الحماية العامة للموقع --- */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000; padding: 20px;
        }

        .auth-card {
            background: var(--card-bg); padding: 25px 20px; border-radius: 16px;
            border: 1px solid var(--border-color); width: 100%; max-width: 320px; text-align: center;
        }

        .auth-card input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #121212; color: #fff; text-align: center; font-size: 1.2rem !important; margin-bottom: 15px;
        }

        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-color); color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        header { text-align: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        header h1 { color: var(--accent-color); }

        /* --- الأزرار العلوية --- */
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .top-btn {
            flex: 1; padding: 12px; background: #2a2a2a; border: 1px solid var(--accent-color);
            color: var(--accent-color); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;
        }

        /* --- النوافذ المنبثقة (Modals) --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 10002; padding: 20px; justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 15px;
        }

        .order-item-card {
            background: #121212; border: 1px solid var(--border-color); padding: 12px;
            border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem;
        }

        .status-pending { color: #f1c40f; font-weight: bold; }
        .status-accepted { color: #2ecc71; font-weight: bold; }
        .status-rejected { color: #e74c3c; font-weight: bold; }

        /* --- المنتجات والنموذج --- */
        .product-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .product-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; }
        .size-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
        .qty-controls { display: flex; align-items: center; gap: 10px; background: #2a2a2a; padding: 4px 8px; border-radius: 8px; }
        .qty-btn { background: var(--accent-color); color: #000; border: none; width: 26px; height: 26px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; }
        .footer-cart { position: sticky; bottom: 10px; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .send-btn { background: var(--accent-color); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* أزرار لوحة التحكم للأدمن */
        .admin-action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn-acc { background: #2ecc71; color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-rej { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
    </style>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- شاشة كلمة السر العامة للمتجر -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h3>🔒 التطبيق محمي</h3>
            <p>أدخل كلمة السر لدخول المتجر</p>
            <input type="password" id="app-pass-input" placeholder="****" maxlength="10">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <!-- نافذة تسجيل دخول الأدمن الخاصة بك -->
    <div class="modal" id="admin-login-modal">
        <div class="modal-content" style="text-align: center;">
            <h3 style="color: var(--accent-color); margin-bottom: 15px;">🔐 لوحة تحكم الأدمن</h3>
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px;">أدخل كلمة سر الأدمن الخاصة بك لإدارة الطلبات</p>
            <input type="password" id="admin-pass-input" placeholder="كلمة السر الخاصة بك" style="width: 100%; padding: 12px; background: #121212; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; text-align: center; margin-bottom: 15px;">
            <button onclick="verifyAdmin()" style="width: 100%; padding: 12px; background: var(--accent-color); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">دخول للوحة التحكم</button>
            <button onclick="document.getElementById('admin-login-modal').style.display='none'" style="width: 100%; padding: 8px; background: transparent; color: var(--text-secondary); border: none; margin-top: 10px; cursor: pointer;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة عرض الطلبات للأدمن -->
    <div class="modal" id="admin-orders-modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-color); margin-bottom: 15px;">📋 إدارة طلبات العملاء (الأدمن)</h3>
            <div id="admin-orders-container">جاري التحميل...</div>
            <button onclick="document.getElementById('admin-orders-modal').style.display='none'" style="margin-top: 15px; width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">إغلاق لوحة التحكم</button>
        </div>
    </div>

    <header>
        <h1>لُبّ - Labb</h1>
        <p>أسهل طريقة لطلب التسالي</p>
    </header>

    <!-- أزرار المتابعة ولوحة التحكم -->
    <div class="btn-group">
        <button class="top-btn" onclick="openOrdersModal()">📦 متابعة طلباتي</button>
        <button class="top-btn" onclick="openAdminDashboard()" style="border-color: #e74c3c; color: #e74c3c;">⚙️ لوحة الأدمن</button>
    </div>

    <div id="products-container"></div>

    <div style="color: var(--accent-color); font-weight: bold; margin: 15px 0 10px;">👤 بيانات التوصيل</div>
    <div class="input-group"><label>الاسم بالكامل</label><input type="text" id="cust-name" required></div>
    <div class="input-group"><label>رقم الهاتف</label><input type="tel" id="cust-phone" required></div>
    <div class="input-group"><label>تابع لمن؟ (جهة / طرف)</label><input type="text" id="cust-referred" required></div>
    <div class="input-group"><label>العنوان التفصيلي</label><input type="text" id="cust-address" required></div>

    <div class="footer-cart">
        <div>إجمالي الحساب: <span id="total-val" style="color: var(--accent-color); font-size: 1.2rem;">0</span> جنيه</div>
        <button class="send-btn" id="send-btn" onclick="sendOrder()">إرسال الطلب 📧</button>
    </div>

    <!-- نافذة متابعة الطلبات للعميل -->
    <div class="modal" id="orders-modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-color); margin-bottom: 15px;">حالة طلباتك</h3>
            <div id="orders-list-container">لا يوجد لديك طلبات سابقة.</div>
            <button onclick="closeOrdersModal()" style="margin-top: 15px; width: 100%; padding: 10px; background: var(--accent-color); border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">إغلاق</button>
        </div>
    </div>

    <script>
        // --- 🔐 الحماية ---
        const APP_PASSWORD = "01090"; // كلمة سر المتجر العامة
        const ADMIN_PASSWORD = "Alhawe123"; // 🔑 كلمة سر لوحة التحكم

        function checkPassword() {
            if (document.getElementById('app-pass-input').value === APP_PASSWORD) {
                document.getElementById('auth-overlay').style.display = 'none';
                sessionStorage.setItem('app_authenticated', 'true');
            } else {
                alert('كلمة السر غير صحيحة');
            }
        }
        if (sessionStorage.getItem('app_authenticated') === 'true') {
            document.getElementById('auth-overlay').style.display = 'none';
        }

        /* --- 🔑 إعدادات Firebase السحابية --- */
        const firebaseConfig = {
            databaseURL: "https://labb-store-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- EmailJS ---
        emailjs.init("GmJXhbuFZa7wFxvn_");

        const productsData = [
            { name: "لب أسود", sizes: [{ name: "ربع كيلو", price: 30 }, { name: "نص كيلو", price: 60 }, { name: "كيلو كامل", price: 120 }] },
            { name: "لب أصفر", sizes: [{ name: "ربع كيلو", price: 30 }, { name: "نص كيلو", price: 60 }, { name: "كيلو كامل", price: 120 }] },
            { name: "لب أبيض فاخر", sizes: [{ name: "ربع كيلو", price: 40 }, { name: "نص كيلو", price: 80 }, { name: "كيلو كامل", price: 160 }] }
        ];

        let cart = {};

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            productsData.forEach((prod) => {
                let html = `<div class="product-card"><div class="product-title">${prod.name}</div>`;
                prod.sizes.forEach((sz) => {
                    const key = `${prod.name} - ${sz.name}`;
                    const qty = cart[key] ? cart[key].qty : 0;
                    html += `
                        <div class="size-row">
                            <div>${sz.name} (${sz.price} ج)</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty('${prod.name}', '${sz.name}', ${sz.price}, -1)">-</button>
                                <span>${qty}</span>
                                <button class="qty-btn" onclick="updateQty('${prod.name}', '${sz.name}', ${sz.price}, 1)">+</button>
                            </div>
                        </div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function updateQty(product, size, price, change) {
            const key = `${product} - ${size}`;
            if (!cart[key]) cart[key] = { product, size, price, qty: 0 };
            cart[key].qty += change;
            if (cart[key].qty <= 0) delete cart[key];
            let total = 0;
            for (let k in cart) total += cart[k].price * cart[k].qty;
            document.getElementById('total-val').innerText = total;
            renderProducts();
        }

        // --- إرسال الطلب (مع التأكد من إدخال كافة البيانات الإجبارية) ---
        function sendOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const referred = document.getElementById('cust-referred').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (Object.keys(cart).length === 0) {
                alert('الرجاء اختيار المنتجات أولاً.');
                return;
            }

            if (!name || !phone || !referred || !address) {
                alert('الرجاء ملء جميع بيانات التوصيل (الاسم، رقم الهاتف، تابع لمن، والعنوان) قبل إرسال الطلب.');
                return;
            }

            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            let itemsText = "";
            let total = 0;
            for (let k in cart) {
                const sub = cart[k].price * cart[k].qty;
                itemsText += `• ${cart[k].product} (${cart[k].size}) × ${cart[k].qty} = ${sub} ج\n`;
                total += sub;
            }

            const orderData = {
                id: orderId,
                name: name,
                phone: phone,
                referred: referred,
                address: address,
                items: itemsText,
                total: `${total} جنيه`,
                status: 'pending', // قيد الانتظار
                date: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            };

            // 1. حفظ الطلب في Firebase
            database.ref('orders/' + orderId).set(orderData);

            // 2. حفظ رقم الطلب في متصفح العميل
            let myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
            myOrders.push(orderId);
            localStorage.setItem('my_orders', JSON.stringify(myOrders));

            // 3. إرسال الإيميل إليك للتنبيه فقط
            const templateParams = {
                order_id: orderId,
                cust_name: name,
                cust_phone: phone,
                cust_referred: referred,
                cust_address: address,
                order_items: itemsText,
                total_price: `${total} جنيه`
            };

            emailjs.send("service_ofjx955", "template_6zol2ee", templateParams).then(() => {
                alert(`تم إرسال طلبك بنجاح! رقم الطلب (${orderId}). يمكنك متابعة حالته من زر "متابعة طلباتي".`);
                cart = {};
                renderProducts();
                // تفريغ حقول البيانات بعد النجاح
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-phone').value = '';
                document.getElementById('cust-referred').value = '';
                document.getElementById('cust-address').value = '';
                document.getElementById('total-val').innerText = '0';
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();
        });

        // --- عرض حالة الطلبات للعميل ---
        function openOrdersModal() {
            document.getElementById('orders-modal').style.display = 'flex';
            const container = document.getElementById('orders-list-container');
            const myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');

            if (myOrders.length === 0) {
                container.innerHTML = "لا يوجد لديك طلبات سابقة.";
                return;
            }

            container.innerHTML = "جاري التحقق من حالة الطلبات...";

            let html = "";
            myOrders.forEach(id => {
                database.ref('orders/' + id).once('value').then(snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        let statusTxt = "⏳ قيد الانتظار";
                        let statusClass = "status-pending";

                        if (data.status === 'accepted') {
                            statusTxt = "🟢 تم قبول الطلب وتجهيزه";
                            statusClass = "status-accepted";
                        } else if (data.status === 'rejected') {
                            statusTxt = "🔴 تم رفض الطلب";
                            statusClass = "status-rejected";
                        }

                        html += `
                            <div class="order-item-card">
                                <div><b>رقم الطلب:</b> ${data.id}</div>
                                <div><b>الوقت:</b> ${data.date}</div>
                                <div><b>الإجمالي:</b> ${data.total}</div>
                                <div style="margin-top:5px;"><b>حالة الطلب:</b> <span class="${statusClass}">${statusTxt}</span></div>
                            </div>`;
                        container.innerHTML = html;
                    } else {
                        html += `
                            <div class="order-item-card">
                                <div><b>رقم الطلب:</b> ${id}</div>
                                <div style="margin-top:5px;"><b>حالة الطلب:</b> <span class="status-accepted">✨ تمت معالجة الطلب</span></div>
                            </div>`;
                        container.innerHTML = html;
                    }
                });
            });
        }

        function closeOrdersModal() {
            document.getElementById('orders-modal').style.display = 'none';
        }

        // --- ⚙️ لوحة تحكم الأدمن ---
        function openAdminDashboard() {
            if (sessionStorage.getItem('admin_authenticated') === 'true') {
                loadAdminOrders();
            } else {
                document.getElementById('admin-login-modal').style.display = 'flex';
            }
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_authenticated', 'true');
                document.getElementById('admin-login-modal').style.display = 'none';
                loadAdminOrders();
            } else {
                alert('كلمة سر الأدمن غير صحيحة!');
            }
        }

        function loadAdminOrders() {
            document.getElementById('admin-orders-modal').style.display = 'flex';
            const container = document.getElementById('admin-orders-container');
            container.innerHTML = "جاري جلب الطلبات الواردة...";

            database.ref('orders').once('value').then(snapshot => {
                const orders = snapshot.val();
                if (!orders) {
                    container.innerHTML = "لا توجد طلبات جديدة حالياً.";
                    return;
                }

                let html = "";
                const keys = Object.keys(orders).reverse();
                let activeOrdersCount = 0;

                keys.forEach(key => {
                    const ord = orders[key];
                    if (ord.status === 'pending') {
                        activeOrdersCount++;
                        html += `
                            <div class="order-item-card" id="order-card-${ord.id}">
                                <div><b>الرقم:</b> ${ord.id} | <b>الاسم:</b> ${ord.name}</div>
                                <div><b>الهاتف:</b> ${ord.phone}</div>
                                <div><b>العنوان:</b> ${ord.address}</div>
                                <div><b>تابع لمن:</b> ${ord.referred}</div>
                                <div style="background:#1a1a1a; padding:6px; border-radius:4px; margin:5px 0; white-space:pre-line;">${ord.items}</div>
                                <div><b>الإجمالي:</b> ${ord.total}</div>
                                <div class="admin-action-btns">
                                    <button class="btn-acc" onclick="handleOrderAction('${ord.id}', 'accepted')">✅ قبول</button>
                                    <button class="btn-rej" onclick="handleOrderAction('${ord.id}', 'rejected')">❌ رفض</button>
                                </div>
                            </div>`;
                    }
                });

                if (activeOrdersCount === 0) {
                    container.innerHTML = "لا توجد طلبات جديدة حالياً.";
                } else {
                    container.innerHTML = html;
                }
            });
        }

        function handleOrderAction(orderId, actionType) {
            database.ref('orders/' + orderId).update({ status: actionType }).then(() => {
                database.ref('orders/' + orderId).remove().then(() => {
                    alert(`تم ${actionType === 'accepted' ? 'قبول' : 'رفض'} الطلب (${orderId}) وإزالته من القائمة بنجاح!`);
                    loadAdminOrders();
                });
            });
        }
    </script>
</body>
</html>
