<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لُبّ - Labb | أسهل طريقة لطلب التسالي</title>
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            direction: rtl;
        }

        input, button { font-size: 16px !important; }

        /* --- شاشة الحماية بالباسورد --- */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000; padding: 20px;
        }

        .auth-card {
            background: var(--card-bg); padding: 25px 20px; border-radius: 16px;
            border: 1px solid var(--border-color); width: 100%; max-width: 320px; text-align: center;
        }

        .auth-card input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #121212; color: #fff; text-align: center; font-size: 1.2rem !important; margin-bottom: 15px;
        }

        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-color); color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        header { text-align: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        header h1 { color: var(--accent-color); }

        /* --- زر وسجل الطلبات --- */
        .my-orders-btn {
            width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid var(--accent-color);
            color: var(--accent-color); border-radius: 8px; font-weight: bold; margin-bottom: 15px; cursor: pointer; font-size: 1rem;
        }

        .orders-modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 10002; padding: 20px; justify-content: center; align-items: center;
        }

        .orders-content {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 15px;
        }

        .order-item-card {
            background: #121212; border: 1px solid var(--border-color); padding: 12px;
            border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem;
        }

        .status-pending { color: #f1c40f; font-weight: bold; }
        .status-accepted { color: #2ecc71; font-weight: bold; }
        .status-rejected { color: #e74c3c; font-weight: bold; }

        /* --- المنتجات والنموذج --- */
        .product-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .product-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; }
        .size-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
        .qty-controls { display: flex; align-items: center; gap: 10px; background: #2a2a2a; padding: 4px 8px; border-radius: 8px; }
        .qty-btn { background: var(--accent-color); color: #000; border: none; width: 26px; height: 26px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; }
        .footer-cart { position: sticky; bottom: 10px; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .send-btn { background: var(--accent-color); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <!-- Firebase SDK (لحفظ حالة الطلب مجانًا وبدون سيرفر) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- شاشة كلمة السر -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h3>🔒 التطبيق محمي</h3>
            <p>أدخل كلمة السر لدخول المتجر</p>
            <input type="password" id="app-pass-input" placeholder="****" maxlength="10">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <header>
        <h1>لُبّ - Labb</h1>
        <p>أسهل طريقة لطلب التسالي</p>
    </header>

    <!-- زر متابعة الطلبات -->
    <button class="my-orders-btn" onclick="openOrdersModal()">📦 متابعة حالة طلباتي</button>

    <div id="products-container"></div>

    <div style="color: var(--accent-color); font-weight: bold; margin: 15px 0 10px;">👤 بيانات التوصيل</div>
    <div class="input-group"><label>الاسم بالكامل</label><input type="text" id="cust-name"></div>
    <div class="input-group"><label>رقم الهاتف</label><input type="tel" id="cust-phone"></div>
    <div class="input-group"><label>تابع لمن؟ (جهة / طرف)</label><input type="text" id="cust-referred"></div>
    <div class="input-group"><label>العنوان التفصيلي</label><input type="text" id="cust-address"></div>

    <div class="footer-cart">
        <div>إجمالي الحساب: <span id="total-val" style="color: var(--accent-color); font-size: 1.2rem;">0</span> جنيه</div>
        <button class="send-btn" id="send-btn" onclick="sendOrder()">إرسال الطلب 📧</button>
    </div>

    <!-- نافذة متابعة الطلبات للعميل -->
    <div class="orders-modal" id="orders-modal">
        <div class="orders-content">
            <h3 style="color: var(--accent-color); margin-bottom: 15px;">حالة طلباتك</h3>
            <div id="orders-list-container">لا يوجد طلبات حالياً.</div>
            <button onclick="closeOrdersModal()" style="margin-top: 15px; width: 100%; padding: 10px; background: var(--accent-color); border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">إغلاق</button>
        </div>
    </div>

    <script>
        // --- 🔐 الحماية ---
        const APP_PASSWORD = "01090";
        function checkPassword() {
            if (document.getElementById('app-pass-input').value === APP_PASSWORD) {
                document.getElementById('auth-overlay').style.display = 'none';
                sessionStorage.setItem('app_authenticated', 'true');
            }
        }
        if (sessionStorage.getItem('app_authenticated') === 'true') {
            document.getElementById('auth-overlay').style.display = 'none';
        }

        // --- 🔑 إعدادات Firebase السحابية لحفظ قبول/رفض الطلبات ---
        const firebaseConfig = {
            databaseURL: "https://labb-store-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- EmailJS ---
        emailjs.init("GmJXhbuFZa7wFxvn_");

        const productsData = [
            { name: "لب أسود", sizes: [{ name: "ربع كيلو", price: 30 }, { name: "نص كيلو", price: 60 }, { name: "كيلو كامل", price: 120 }] },
            { name: "لب أصفر", sizes: [{ name: "ربع كيلو", price: 30 }, { name: "نص كيلو", price: 60 }, { name: "كيلو كامل", price: 120 }] },
            { name: "لب أبيض فاخر", sizes: [{ name: "ربع كيلو", price: 40 }, { name: "نص كيلو", price: 80 }, { name: "كيلو كامل", price: 160 }] }
        ];

        let cart = {};

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            productsData.forEach((prod) => {
                let html = `<div class="product-card"><div class="product-title">${prod.name}</div>`;
                prod.sizes.forEach((sz) => {
                    const key = `${prod.name} - ${sz.name}`;
                    const qty = cart[key] ? cart[key].qty : 0;
                    html += `
                        <div class="size-row">
                            <div>${sz.name} (${sz.price} ج)</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty('${prod.name}', '${sz.name}', ${sz.price}, -1)">-</button>
                                <span>${qty}</span>
                                <button class="qty-btn" onclick="updateQty('${prod.name}', '${sz.name}', ${sz.price}, 1)">+</button>
                            </div>
                        </div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function updateQty(product, size, price, change) {
            const key = `${product} - ${size}`;
            if (!cart[key]) cart[key] = { product, size, price, qty: 0 };
            cart[key].qty += change;
            if (cart[key].qty <= 0) delete cart[key];
            let total = 0;
            for (let k in cart) total += cart[k].price * cart[k].qty;
            document.getElementById('total-val').innerText = total;
            renderProducts();
        }

        // --- إرسال الطلب ---
        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const referred = document.getElementById('cust-referred').value;
            const address = document.getElementById('cust-address').value;

            if (Object.keys(cart).length === 0 || !name) {
                alert('الرجاء اختيار المنتجات وكتابة الاسم.');
                return;
            }

            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            let itemsText = "";
            let total = 0;
            for (let k in cart) {
                const sub = cart[k].price * cart[k].qty;
                itemsText += `• ${cart[k].product} (${cart[k].size}) × ${cart[k].qty} = ${sub} ج\n`;
                total += sub;
            }

            // رابط تحديث الحالة فقط من الجيميل
            const siteUrl = window.location.href.split('?')[0];
            const acceptUrl = `${siteUrl}?action=update_status&order_id=${orderId}&status=accepted`;
            const rejectUrl = `${siteUrl}?action=update_status&order_id=${orderId}&status=rejected`;

            const orderData = {
                id: orderId,
                name: name,
                total: `${total} جنيه`,
                status: 'pending', // قيد الانتظار
                date: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            };

            // 1. حفظ الطلب في Firebase
            database.ref('orders/' + orderId).set(orderData);

            // 2. حفظ رقم الطلب في متصفح العميل
            let myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
            myOrders.push(orderId);
            localStorage.setItem('my_orders', JSON.stringify(myOrders));

            // 3. إرسال الإيميل إليك
            const templateParams = {
                order_id: orderId,
                cust_name: name,
                cust_phone: phone || 'غير مدخل',
                cust_referred: referred || 'غير مدخل',
                cust_address: address || 'غير مدخل',
                order_items: itemsText,
                total_price: `${total} جنيه`,
                accept_url: acceptUrl,
                reject_url: rejectUrl
            };

            emailjs.send("service_ofjx955", "template_6zol2ee", templateParams).then(() => {
                alert(`تم إرسال طلبك بنجاح! رقم الطلب (${orderId}). يمكنك متابعة حالته من زر "متابعة حالة طلباتي".`);
                cart = {};
                renderProducts();
            });
        }

        // --- التماثل عند ضغطك على رابط الإيميل ---
        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');
            const orderId = urlParams.get('order_id');
            const status = urlParams.get('status');

            // إذا دخلت أنت عبر رابط القبول أو الرفض في الإيميل
            if (action === 'update_status' && orderId && status) {
                database.ref('orders/' + orderId).update({ status: status }).then(() => {
                    if (status === 'accepted') {
                        alert(`✅ تم تحديث الطلب (${orderId}) إلى: تم القبول.`);
                    } else if (status === 'rejected') {
                        alert(`❌ تم تحديث الطلب (${orderId}) إلى: تم الرفض.`);
                    }
                });
            }
        });

        // --- عرض حالة الطلبات للعميل ---
        function openOrdersModal() {
            document.getElementById('orders-modal').style.display = 'flex';
            const container = document.getElementById('orders-list-container');
            const myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');

            if (myOrders.length === 0) {
                container.innerHTML = "لا يوجد لديك طلبات سابقة.";
                return;
            }

            container.innerHTML = "جاري التحقق من حالة الطلبات...";

            let html = "";
            myOrders.forEach(id => {
                database.ref('orders/' + id).once('value').then(snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        let statusTxt = "⏳ قيد الانتظار";
                        let statusClass = "status-pending";

                        if (data.status === 'accepted') {
                            statusTxt = "🟢 تم قبول الطلب";
                            statusClass = "status-accepted";
                        } else if (data.status === 'rejected') {
                            statusTxt = "🔴 تم رفض الطلب";
                            statusClass = "status-rejected";
                        }

                        html += `
                            <div class="order-item-card">
                                <div><b>رقم الطلب:</b> ${data.id}</div>
                                <div><b>الوقت:</b> ${data.date}</div>
                                <div><b>الإجمالي:</b> ${data.total}</div>
                                <div style="margin-top:5px;"><b>حالة الطلب:</b> <span class="${statusClass}">${statusTxt}</span></div>
                            </div>`;
                        container.innerHTML = html;
                    }
                });
            });
        }

        function closeOrdersModal() {
            document.getElementById('orders-modal').style.display = 'none';
        }
    </script>
</body>
</html>
