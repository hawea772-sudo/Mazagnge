<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لُبّ - Labb</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #fff; padding: 20px; direction: rtl; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #f39c12; }
        .options { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

    <!-- لب أسود -->
    <div class="card">
        <div class="title">لب أسود</div>
        <div class="options">
            <div class="btn">ربع كيلو<br>300 ج</div>
            <div class="btn">نص كيلو<br>600 ج</div>
            <div class="btn">كيلو كامل<br>1200 ج</div>
        </div>
    </div>

    <!-- لب أصفر -->
    <div class="card">
        <div class="title">لب أصفر</div>
        <div class="options">
            <div class="btn">ربع كيلو<br>300 ج</div>
            <div class="btn">نص كيلو<br>600 ج</div>
            <div class="btn">كيلو كامل<br>1200 ج</div>
        </div>
    </div>

    <!-- لب أبيض فاخر -->
    <div class="card">
        <div class="title">لب أبيض فاخر</div>
        <div class="options">
            <div class="btn">ربع كيلو<br>300 ج</div>
            <div class="btn">نص كيلو<br>600 ج</div>
            <div class="btn">كيلو كامل<br>1200 ج</div>
        </div>
    </div>

</body>
</html>
