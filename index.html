<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لُبّ - Labb</title>
  <link rel="manifest" href="manifest.json" />
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

  <!-- محتوى التطبيق الخاص بك هنا -->

  <script>
    // 1. تهيئة المفاتيح الخاصة بـ EmailJS
    const EMAILJS_PUBLIC_KEY = "GmJXhbuFZa7wFxvn_";
    const EMAILJS_SERVICE_ID = "service_ofjx955";[cite: 2]
    const EMAILJS_TEMPLATE_ID = "template_xat6xes";[cite: 6]

    // Initialize EmailJS
    (function() {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    })();

    // 2. دالة إرسال الطلب عبر Gmail
    function sendOrder(orderData) {
      // إعداد المعاملات المربوطة بالقالب
      const templateParams = {
        cust_name: orderData.name,
        cust_phone: orderData.phone,
        cust_address: orderData.address,
        order_items: orderData.items,
        total_price: orderData.total
      };

      // إرسال الإيميل
      return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
        .then(function(response) {
            console.log('SUCCESS!', response.status, response.text);
            alert('تم إرسال طلبك بنجاح! شكراً لتسوقك من لُبّ.');
        }, function(error) {
            console.log('FAILED...', error);
            alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
        });
    }
  </script>
</body>
</html>
