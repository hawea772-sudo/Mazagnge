<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لُبّ - Labb</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-glass: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent: #ffb703;
            --text-color: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
            direction: rtl;
        }

        header {
            text-align: center;
            padding: 20px;
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        header h1 { color: var(--accent); font-size: 2rem; margin-bottom: 5px; }

        .product-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .size-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 30px;
        }

        .qty-btn {
            background: var(--accent);
            color: #000;
            border: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .send-btn {
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <h1>🌻 لُـبّ - Labb</h1>
        <p>التسالي الذهبية بين يديك</p>
    </header>

    <div class="product-card">
        <div class="product-title">لب أسود فاخر</div>
        <div class="size-row">
            <span>ربع كيلو (30 ج)</span>
            <div class="qty-controls">
                <button class="qty-btn">-</button>
                <span>0</span>
                <button class="qty-btn">+</button>
            </div>
        </div>
    </div>
</body>
</html>
